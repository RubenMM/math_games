<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match: Math Edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="name-modal" class="modal-overlay">
  <div class="modal">
    <h1>Memory Match</h1>
    <p>Match each question with its answer!</p>
    <label for="player-name-input">Enter your name</label>
    <input type="text" id="player-name-input" placeholder="Your name" maxlength="24" autocomplete="off">
    <button id="start-btn">Start Game</button>
  </div>
</div>

<div id="win-modal" class="modal-overlay hidden">
  <div class="modal">
    <h1>🎉 You won!</h1>
    <p id="win-player-line"></p>
    <p id="win-steps-line"></p>
    <p id="win-highscore-line"></p>
    <button id="play-again-btn">Play Again</button>
  </div>
</div>

<div id="game-container" class="hidden">
  <header class="hud">
    <div class="hud-item">Player: <span id="hud-player">-</span></div>
    <div class="hud-item">Points: <span id="hud-points">0</span></div>
    <div class="hud-item">Steps: <span id="hud-steps">0</span></div>
    <div class="hud-item">Best: <span id="hud-best">-</span></div>
  </header>
  <main id="board" class="board"></main>
</div>

<script src="deck-config.js"></script>
<script src="game.js"></script>
</body>
</html>
